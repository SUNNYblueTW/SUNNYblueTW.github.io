                <span>Sudoku 規則介紹</span>

            <div class="text_used">
                <p>
                    <span class="to_center">我相信很多人有看過「Sudoku」這個邏輯遊戲，廢話不多說，來看一下有關於Sudoku的規則:<br><br></span>
                    <span class="to_center">以下用<span class="bold">9*9</span>這一個Category來解說。<br><br></span>
                    <span class="to_center">第1頁:在每一列(row)中，數字1~9在同一列裡面不能出現多於1次。<br></span>
                    <span class="to_center">第2頁:在每一行(column)中，數字1~9在同一行裡面不能出現多於1次。<br></span>
                    <span class="to_center">第3頁:在一個9*9grid中，可以被分割成9個3*3區塊:<br></span>
                    <span class="to_center">在每一個3*3區塊中，數字1~9在同一個3*3區塊裡面不能出現多於1次。<br></span>
                    <span class="to_center">第4頁:總結一個數字確定後，同一個數字不能再出現的地方。<br></span>
