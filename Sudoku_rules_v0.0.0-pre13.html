            <div class="text_used">
                <p>
                    <span>我相信很多人有看過「Sudoku」這個邏輯遊戲，廢話不多說，來看一下有關於Sudoku的規則:<br></span>
                    <span>以下用<b>9*9</b>這一個Category來解說。<br></span>
                    <span>1.在每一列中，數字1~9在同一列裡面不能出現多於1次。<br></span>
                    <span>2.在每一行中，數字1~9在同一行裡面不能出現多於1次。<br></span>
                    <span>3.在一個9*9grid中，可以被分割成9個3*3區塊:<br></span>
                    <span>在每一個3*3區塊中，數字1~9在同一個3*3區塊裡面不能出現多於1次。<br></span>
                </p>
